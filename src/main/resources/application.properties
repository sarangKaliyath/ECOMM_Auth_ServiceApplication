# application.name should not contain "_"
# Spring does not accept underscores (_) in service IDs when resolving hostnames.
#Even though Eureka allows it,
# LoadBalancer treats the service name as a hostname,
# and hostnames cannot contain underscores (RFC violation).
spring.application.name=ECOMM-Auth-Service-Application
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/shop_easy_auth_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
jwt.secret=very-secure-and-very-long-secret-key-at-least-32-chars-long

server.port=${SERVER_PORT:8081}

# Register this microservice with the Eureka Server.
# allowing other services to discover and call it by service name.
eureka.client.register-with-eureka=true

# Fetch the service registry from Eureka.
# Required, so this service can discover and call other microservices.
eureka.client.fetch-registry=true

# URL of the Eureka Server where this service will register itself.
# /eureka/ is the default endpoint exposed by the Eureka Server.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=172.18.63.162:9092

# google oauth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# OAuth2 post-login redirect (frontend callback page)
oauth.redirect.url=${OAUTH_REDIRECT_URL:http://localhost:3000/oauth/callback}

# VerificationCode
code.length=6
code.expiry.login=5
code.expiry.password-reset=10
code.expiry.email-verification=15
code.max-attempts=5